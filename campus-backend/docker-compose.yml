services:
  # =================== Nginx 反代（HTTPS） ===================
  nginx:
    image: nginx:alpine
    container_name: campus-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # 前端静态文件（需先构建）
      - ../campus-web/dist:/usr/share/nginx/html/main:ro
      - ../campus-web-admin/dist:/usr/share/nginx/html/admin:ro
    depends_on:
      - campus-backend
    networks:
      - campus-net

  # =================== 后端应用服务 ===================
  campus-backend:
    build: .
    container_name: campus-backend
    ports:
      - "8080:8080" # 映射宿主机端口:容器端口
    env_file:
      - .env
    environment:
      # 覆盖 application.properties 中的配置
      # 数据库连接：使用服务名 'mysql' 代替 localhost
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/campus_tutor_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      # redis连接：使用服务名 'redis' 代替 localhost
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      # CORS 添加服务器地址
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:3001}
    volumes:
      - ./uploads:/app/uploads # 挂载上传文件目录，防止重启丢失
    depends_on:
      - mysql
      - redis
    networks:
      - campus-net

  # =================== MySQL 数据库服务 ===================
  mysql:
    image: mysql:8.0
    container_name: campus-mysql
    ports:
      - "3306:3306" # 暴露端口以便本地 Navicat 连接，生产环境可考虑关闭
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=campus_tutor_db
    volumes:
      - mysql-data:/var/lib/mysql # 数据持久化卷
      # 初始化 SQL 脚本，容器首次启动时会自动执行
      - ./sql/campus_tutor_full.sql:/docker-entrypoint-initdb.d/01_init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    networks:
      - campus-net

  # =================== Redis 缓存服务 ===================
  redis:
    image: redis:alpine
    container_name: campus-redis
    ports:
      - "6379:6379"
    networks:
      - campus-net

volumes:
  mysql-data:

networks:
  campus-net:
    driver: bridge
