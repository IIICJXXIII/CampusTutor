version: '3.8'
services:
  # 后端应用服务
  campus-backend:
    build: .
    container_name: campus-backend
    ports:
      - "8080:8080" # 映射宿主机端口:容器端口
    environment:
      # 覆盖 application.properties 中的配置
      # 数据库连接：使用服务名 'mysql' 代替 localhost
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/campus_tutor_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Sync743df
      # redis连接：使用服务名 'redis' 代替 localhost
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    volumes:
      - ./uploads:/app/uploads # 挂载上传文件目录，防止重启丢失
    depends_on:
      - mysql
      - redis
    networks:
      - campus-net

  # MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: campus-mysql
    ports:
      - "3306:3306" # 暴露端口以便本地 Navicat 连接，生产环境可考虑关闭
    environment:
      - MYSQL_ROOT_PASSWORD=Sync743df
      - MYSQL_DATABASE=campus_tutor_db
    volumes:
      - mysql-data:/var/lib/mysql # 数据持久化卷
      # 初始化 SQL 脚本，容器首次启动时会自动执行
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./sql/data.sql:/docker-entrypoint-initdb.d/02_data.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    networks:
      - campus-net

  # Redis 缓存服务
  redis:
    image: redis:alpine
    container_name: campus-redis
    ports:
      - "6379:6379"
    networks:
      - campus-net

volumes:
  mysql-data:

networks:
  campus-net:
    driver: bridge
