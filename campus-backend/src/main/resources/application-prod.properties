# ==================== 生产环境配置 ====================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/campus_tutor_db?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.timeout=10000ms

# ==================== 日志配置 ====================
logging.level.com.campus=info
logging.level.org.springframework.web=warn

# ==================== 关闭 SQL 日志 ====================
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl

# ==================== JWT 配置 ====================
jwt.secret=${JWT_SECRET:CampusTutor2026ProductionSecretKey}
jwt.expiration=604800000
jwt.header=Authorization
jwt.prefix=Bearer

# ==================== 关闭 Swagger ====================
knife4j.production=true
