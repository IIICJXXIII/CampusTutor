# ============================================================
# CampusTutor 主配置文件
# 所有敏感值通过环境变量注入，本文件不包含任何明文密钥
# ============================================================

# ---- 服务端口 ----
server.port=${SERVER_PORT:8080}

# ---- 数据源 ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_tutor_db?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- Redis ----
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ---- MyBatis-Plus ----
mybatis-plus.mapper-locations=classpath:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.campus.module.*.entity
mybatis-plus.global-config.db-config.id-type=auto
# 生产环境关闭 SQL 日志（开发环境在 application-dev.properties 中开启）
# mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ---- JWT ----
jwt.secret=${JWT_SECRET:campus-tutor-jwt-secret-key-must-be-at-least-32-bytes}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.header=Authorization
jwt.prefix=Bearer

# ---- 文件上传 ----
file.upload.path=${FILE_UPLOAD_PATH:./uploads}
file.upload.base-url=${FILE_UPLOAD_BASE_URL:http://localhost:8080/uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ---- 高德地图 ----
amap.key=${AMAP_KEY:}

# ---- LBS搜索配置 ----
lbs.search.default-radius=${LBS_SEARCH_DEFAULT_RADIUS:20}
lbs.search.max-radius=${LBS_SEARCH_MAX_RADIUS:100}

# ---- LLM (AI) ----
llm.enabled=${LLM_ENABLED:true}
llm.provider=${LLM_PROVIDER:deepseek}
llm.api-key=${LLM_API_KEY:}
llm.base-url=${LLM_BASE_URL:https://api.deepseek.com}
llm.model=${LLM_MODEL:deepseek-chat}

# ---- 百度 OCR ----
baidu.ocr.enabled=${BAIDU_OCR_ENABLED:true}
baidu.ocr.api-key=${BAIDU_OCR_API_KEY:gI099ZXdFhpgtTCFRh09oEhb}
baidu.ocr.secret-key=${BAIDU_OCR_SECRET_KEY:0XhlchlReiYo7x026ElJYBRXBvMN11mf}

# ---- 豆包视觉 ----
doubao.vision.enabled=${DOUBAO_VISION_ENABLED:true}
doubao.vision.api-key=${DOUBAO_VISION_API_KEY:}
doubao.vision.model=${DOUBAO_VISION_MODEL:doubao-seed-1-8-251228}
doubao.vision.base-url=${DOUBAO_VISION_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}

# ---- CORS ----
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3001}

# ---- Knife4j (Swagger) ----
springdoc.swagger-ui.path=/doc.html
